<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the row that wins is the subject, and it wins by being the narrowest -->
  <path d="M58 162 L110 162 L110 178 L58 178 Z" fill="#fff2c4" />

  <g fill="#dbe7ff">
    <path d="M94 30 L122 30 L122 52 L94 52 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- one packet, arriving at the whole table rather than at its first row -->
    <path d="M94 30 L122 30 L122 52 L94 52 Z" />
    <path d="M108 52 L108 88 M103 83 L108 89 L113 83" />

    <!-- the table: every row compared at once, and none of them above another -->
    <path d="M46 82 L170 82 L170 190 L46 190 Z" />

    <path d="M58 96 L158 96 L158 112 L58 112 Z" />
    <path d="M58 118 L142 118 L142 134 L58 134 Z" />
    <path d="M58 140 L126 140 L126 156 L58 156 Z" />

    <!-- a row nobody wrote by hand: it arrived, and it can leave the same way -->
    <path d="M40 126 L55 126 M49 121 L55 126 L49 131" />

    <!-- and the narrowest match takes the packet, past the widest that matched too -->
    <path d="M114 170 L158 170 M153 165 L159 170 L153 175" />

    <!-- a table hanging from the gateway itself, associated with no subnet -->
    <path d="M200 92 L200 118" />
    <path d="M178 118 L234 118 L234 172 L178 172 Z" />
    <path d="M186 132 L226 132 M186 145 L226 145 M186 158 L212 158" />
  </g>

  <!-- the row that wins, and the row whose target left without it -->
  <g fill="none" stroke="#1d1d1b" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M130 138 L146 158 M146 138 L130 158" />
    <path d="M58 162 L110 162 L110 178 L58 178 Z" />
  </g>

  <!--
