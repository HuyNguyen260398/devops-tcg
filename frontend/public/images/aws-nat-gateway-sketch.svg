    <path d="M108 46 L108 66 M103 61 L108 67 L113 61" />
    <path d="M154 46 L122 66 M129 69 L120 68 L128 62" />

    <!-- one gateway, rewriting each connection to its own address and a port -->
    <path d="M84 70 L132 70 L132 108 L84 108 Z" />

    <!-- and a meter that never stops, per hour and again per gigabyte -->
    <path d="M141 78 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0" />
    <path d="M141 78 L146 73" />

    <!-- a ceiling for each destination rather than one for the gateway -->
    <path d="M100 108 L65 126 M71 129 L63 127 L70 122" />
    <path d="M108 108 L108 126 M103 121 L108 127 L113 121" />
    <path d="M116 108 L151 126 M145 122 L153 127 L144 129" />
    <path d="M46 130 L84 130 L84 150 L46 150 Z" />
    <path d="M138 130 L176 130 L176 150 L138 150 Z" />
    <path d="M48 135 L54 135 L54 145 L48 145 Z" />
    <path d="M94 135 L100 135 L100 145 L94 145 Z" />
    <path d="M101 135 L107 135 L107 145 L101 145 Z" />
    <path d="M108 135 L114 135 L114 145 L108 145 Z" />
    <path d="M115 135 L121 135 L121 145 L115 145 Z" />
    <path d="M122 135 L128 135 L128 145 L122 145 Z" />
    <path d="M140 135 L146 135 L146 145 L140 145 Z" />

    <path d="M65 150 L65 159 M60 154 L65 160 L70 154" />
    <path d="M111 150 L111 159 M106 154 L111 160 L116 154" />
    <path d="M157 150 L157 159 M152 154 L157 160 L162 154" />

    <!-- three destinations, and only one of them is anywhere near the limit -->
    <path d="M52 162 L78 162 L78 182 L52 182 Z" />
    <path d="M98 162 L124 162 L124 182 L98 182 Z" />
    <path d="M144 162 L170 162 L170 182 L144 182 Z" />

    <!-- the same gateway with no public address, translating inwards instead -->
    <path d="M194 96 L232 96 L232 134 L194 134 Z" />
    <path d="M190 115 L172 115 M178 110 L171 115 L178 120" />
  </g>

  <!-- the strip that is full, and the address the private one does not hold -->
  <g fill="none" stroke="#1d1d1b" stroke-width="4.2" stroke-linejoin="round">
    <path d="M92 130 L130 130 L130 150 L92 150 Z" />
  </g>
  <path d="M196 140 L230 140 L230 152 L196 152 Z" fill="none" stroke="#1d1d1b"
        stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="4 4" />

