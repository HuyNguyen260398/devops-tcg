  <path d="M122 135 L128 135 L128 145 L122 145 Z" fill="#dbe7ff" />
  <path d="M140 135 L146 135 L146 145 L140 145 Z" fill="#dbe7ff" />

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- three machines, and nothing about them reaches the gateway by being near it -->
    <path d="M50 24 L74 24 L74 46 L50 46 Z" />
    <path d="M96 24 L120 24 L120 46 L96 46 Z" />
    <path d="M142 24 L166 24 L166 46 L142 46 Z" />
