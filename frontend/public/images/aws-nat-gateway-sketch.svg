<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the strip that is nearly gone is the subject: one destination, 55,000 ports -->
  <path d="M92 130 L130 130 L130 150 L92 150 Z" fill="#fff2c4" />

  <path d="M48 135 L54 135 L54 145 L48 145 Z" fill="#dbe7ff" />
  <path d="M94 135 L100 135 L100 145 L94 145 Z" fill="#dbe7ff" />
  <path d="M101 135 L107 135 L107 145 L101 145 Z" fill="#dbe7ff" />
  <path d="M108 135 L114 135 L114 145 L108 145 Z" fill="#dbe7ff" />
