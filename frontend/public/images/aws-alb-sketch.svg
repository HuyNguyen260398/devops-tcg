<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the balancer is the subject, so it takes the highlighter -->
  <path d="M46 66 L232 66 L232 136 L46 136 Z" fill="#fff2c4" />

  <!-- what each request says is the only thing a rule has to go on -->
  <g fill="#dbe7ff">
    <path d="M52 19 L82 19 L82 27 L52 27 Z" />
    <path d="M60 82 L86 82 L86 92 L60 92 Z" />
    <path d="M52 166 L128 166 L128 176 L52 176 Z" />
    <path d="M156 166 L232 166 L232 176 L156 176 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- two requests, distinguishable only by what is written in them -->
    <path d="M44 12 L116 12 L116 46 L44 46 Z" />
    <path d="M52 19 L82 19 L82 27 L52 27 Z" />
    <path d="M52 34 L100 34 M52 41 L86 41" />

    <path d="M162 12 L234 12 L234 46 L234 46 L162 46 Z" />
    <path d="M170 19 L200 19 L200 27 L170 27 Z" />
    <path d="M170 34 L218 34 M170 41 L204 41" />

    <!-- the client connection ends on the edge: it is read, not passed on -->
    <path d="M80 46 L80 62" />
    <path d="M198 46 L198 62" />

    <!-- the balancer itself -->
    <path d="M46 66 L232 66 L232 136 L46 136 Z" stroke-width="4.2" />

    <!-- one rule per target group, each matching on the request above -->
    <path d="M54 76 L150 76 L150 100 L54 100 Z" />
    <path d="M60 82 L86 82 L86 92 L60 92 Z" />
    <path d="M94 87 L142 87" />

    <path d="M54 106 L150 106 L150 130 L54 130 Z" />
    <path d="M60 112 L86 112 L86 122 L60 122 Z" />
    <path d="M94 117 L142 117" />

    <!-- a second connection starts here, opened by the balancer itself -->
    <path d="M90 140 L90 156 M84 150 L90 157 L96 150" />
    <path d="M188 140 L188 156 M182 150 L188 157 L194 150" />

    <!-- one target group per rule, health-checked -->
    <path d="M46 160 L134 160 L134 206 L46 206 Z" />
    <path d="M52 166 L128 166 L128 176 L52 176 Z" />
    <path d="M52 180 L128 180 L128 190 L52 190 Z" />
    <path d="M52 194 L128 194 L128 204 L52 204 Z" />

    <path d="M150 160 L238 160 L238 206 L150 206 Z" />
    <path d="M156 166 L232 166 L232 176 L156 176 Z" />
    <path d="M156 180 L232 180 L232 190 L156 190 Z" />
  </g>

  <!-- the target that failed its health check, and so is not sent to -->
  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linejoin="round" opacity="0.45">
    <path d="M156 194 L232 194 L232 204 L156 204 Z" stroke-dasharray="4 4" />
    <path d="M158 195 L230 203 M230 195 L158 203" />
  </g>

  <!-- where a connection stops, and where the next one begins -->
  <g fill="#1d1d1b">
    <circle cx="80" cy="66" r="3.4" />
    <circle cx="198" cy="66" r="3.4" />
    <circle cx="90" cy="139" r="3.4" />
    <circle cx="188" cy="139" r="3.4" />
  </g>

  <!--
    The official AWS Application Load Balancer resource icon
    (Res_Elastic-Load-Balancing_Application-Load-Balancer_48) from the AWS
    Architecture Icons package, embedded exactly as shipped: #8C4FFF line art,
    uniformly scaled, not recoloured and not otherwise altered, so the sketch
    theme shows the real product mark rather than a hand-drawn imitation of one.
  -->
