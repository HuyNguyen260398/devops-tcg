<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.93) translate(-139 -110)">
  <!-- permissions live on the role, so the roles take the highlighter -->
  <g fill="#fff2c4">
    <path d="M104 30 L160 30 L160 92 L104 92 Z" />
    <path d="M104 128 L160 128 L160 190 L104 190 Z" />
  </g>
  <g fill="#dbe7ff">
    <path d="M34 40 L64 40 L64 64 L34 64 Z" />
    <path d="M34 98 L64 98 L64 122 L34 122 Z" />
    <path d="M34 156 L64 156 L64 180 L34 180 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- three subjects, and not one of them holds a permission of its own -->
    <path d="M34 40 L64 40 L64 64 L34 64 Z" />
    <circle cx="49" cy="48" r="3.6" />
    <path d="M42 59 C42 52 56 52 56 59" />
    <path d="M34 98 L64 98 L64 122 L34 122 Z" />
    <circle cx="49" cy="106" r="3.6" />
    <path d="M42 117 C42 110 56 110 56 117" />
    <path d="M34 156 L64 156 L64 180 L34 180 Z" />
    <circle cx="49" cy="164" r="3.6" />
    <path d="M42 175 C42 168 56 168 56 175" />

    <!-- assignments: the middle subject carries both roles, and its access is
         whatever the two of them add up to -->
    <path d="M66 52 C84 52 88 50 102 48" />
    <path d="M66 110 C84 110 88 74 102 66" />
    <path d="M66 110 C84 110 88 142 102 150" />
    <path d="M66 168 C84 168 88 170 102 172" />

    <!-- the roles: a named bundle, and the only holder of a permission -->
    <path d="M104 30 L160 30 L160 92 L104 92 Z" />
    <path d="M108 50 L156 50" />
    <path d="M104 128 L160 128 L160 190 L104 190 Z" />
    <path d="M108 148 L156 148" />
    <path d="M123 60 L152 60 M123 71 L146 71 M123 82 L150 82" />
    <path d="M123 158 L148 158 M123 169 L152 169 M123 180 L142 180" />
  </g>

  <g fill="#1d1d1b">
    <rect x="112" y="37" width="30" height="5" rx="2.5" />
    <rect x="112" y="135" width="24" height="5" rx="2.5" />
    <circle cx="115" cy="60" r="3" />
    <circle cx="115" cy="71" r="3" />
    <circle cx="115" cy="82" r="3" />
    <circle cx="115" cy="158" r="3" />
    <circle cx="115" cy="169" r="3" />
    <circle cx="115" cy="180" r="3" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- what the assigned roles name is what reaches the resource -->
    <path d="M162 60 C180 60 182 86 192 98" />
    <path d="M186 92 L193 99 L185 104" />
    <path d="M162 160 C180 160 182 134 192 122" />
    <path d="M185 116 L193 121 L186 128" />

    <path d="M196 86 L240 86 L240 134 L196 134 Z" />
    <circle cx="218" cy="104" r="6" />
    <path d="M214 124 L218 110 L222 124 Z" />
  </g>

  <!-- nothing has to say no: an operation no assigned role names is already refused -->
  <g fill="none" stroke="#1d1d1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M202 152 L236 152 L236 178 L202 178 Z" stroke-dasharray="4 4" />
    <path d="M211 159 L227 171 M227 159 L211 171" />
  </g>
  </g>
</svg>
