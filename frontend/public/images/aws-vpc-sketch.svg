<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the route tables are the subject, so they take the highlighter -->
  <path d="M52 115 L128 115 L128 157 L52 157 Z" fill="#fff2c4" />
  <path d="M150 115 L226 115 L226 157 L150 157 Z" fill="#fff2c4" />

  <g fill="#dbe7ff">
    <path d="M66 75 L82 75 L82 91 L66 91 Z" />
    <path d="M98 75 L114 75 L114 91 L98 91 Z" />
    <path d="M164 75 L180 75 L180 91 L164 91 Z" />
    <path d="M196 75 L212 75 L212 91 L196 91 Z" />
    <path d="M64 143 L80 143 L80 149 L64 149 Z" />
    <path d="M96 143 L112 143 L112 149 L96 149 Z" />
    <path d="M125 170 L153 170 L153 190 L125 190 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- one VPC: one region, one address range, everything else inside it -->
    <path d="M44 50 L234 50 L234 180 L44 180 Z" />

    <!-- two subnets, drawn the same because they are the same -->
    <path d="M52 62 L128 62 L128 104 L52 104 Z" />
    <path d="M66 75 L82 75 L82 91 L66 91 Z" />
    <path d="M98 75 L114 75 L114 91 L98 91 Z" />
    <path d="M150 62 L226 62 L226 104 L150 104 Z" />
    <path d="M164 75 L180 75 L180 91 L164 91 Z" />
    <path d="M196 75 L212 75 L212 91 L196 91 Z" />

    <!-- the local route: each subnet reaches the other with nothing configured -->
    <path d="M130 83 L148 83 M136 78 L130 83 L136 88 M142 78 L148 83 L142 88" />

    <!-- a packet leaving an interface is matched against its subnet's table -->
    <path d="M90 104 L90 113 M86 109 L90 114 L94 109" />
    <path d="M188 104 L188 113 M184 109 L188 114 L192 109" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 115 L128 115 L128 157 L52 157 Z" />
    <path d="M150 115 L226 115 L226 157 L150 157 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- the row both tables carry, unasked for and identical -->
    <path d="M58 122 L122 122 L122 136 L58 136 Z" />
    <path d="M64 126 L80 126 L80 132 L64 132 Z" />
    <path d="M86 129 L92 129 M89 126 L92 129 L89 132" />
    <path d="M96 126 L112 126 L112 132 L96 132 Z" />
    <path d="M156 122 L220 122 L220 136 L156 136 Z" />
    <path d="M162 126 L178 126 L178 132 L162 132 Z" />
    <path d="M184 129 L190 129 M187 126 L190 129 L187 132" />
    <path d="M194 126 L210 126 L210 132 L194 132 Z" />

    <!-- the one row that differs, and the only reason either subnet differs -->
    <path d="M58 139 L122 139 L122 153 L58 153 Z" />
    <path d="M64 143 L80 143 L80 149 L64 149 Z" />
    <path d="M86 146 L92 146 M89 143 L92 146 L89 149" />
    <path d="M96 143 L112 143 L112 149 L96 149 Z" />

    <!-- the gateway the route names, sitting on the boundary it crosses -->
    <path d="M125 170 L153 170 L153 190 L125 190 Z" />
    <path d="M90 157 L90 165 L139 165 L139 170" />
    <path d="M139 190 L139 197 M134 191 L139 198 L144 191" />
  </g>

  <!-- the other table has no such row, so the packet has nowhere to go -->
  <path d="M188 157 L188 161" fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3" />
  <path d="M156 139 L220 139 L220 153 L156 153 Z" fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="4 4" />
  <path d="M181 163 L195 175 M195 163 L181 175" fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" />

  <!--
    The official Amazon VPC resource icon
    (Res_Amazon-VPC_Virtual-private-cloud-VPC_48) from the AWS Architecture
    Icons package, embedded exactly as shipped: #8C4FFF line art, uniformly
    scaled, not recoloured and not otherwise altered, so the sketch theme shows
    the real product mark rather than a hand-drawn imitation of one.
  -->
