<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <g transform="translate(7 14)">
  <!-- the one row that carries the whole of the way out -->
  <g fill="#fff2c4">
    <path d="M60 100 L124 100 L124 110 L60 110 Z" />
  </g>

  <g fill="#dbe7ff">
    <path d="M62 48 L118 48 L118 68 L62 68 Z" />
    <path d="M54 134 L130 134 L130 150 L54 150 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- a subnet with no way to the internet at all -->
    <path d="M40 38 L146 38 L146 154 L40 154 Z" />

    <!-- the machine, which is told none of this and asks for the service by name -->
    <path d="M62 48 L118 48 L118 68 L62 68 Z" />
    <path d="M90 68 L90 78 M85 73 L90 79 L95 73" />

    <!-- its table: the local row, one row naming a prefix list, and no way out -->
    <path d="M54 80 L130 80 L130 128 L54 128 Z" />
    <path d="M60 86 L124 86 L124 96 L60 96 Z" />
    <path d="M60 100 L124 100 L124 110 L60 110 Z" />

    <!-- the other kind, which is an interface standing here and adds no row at all -->
    <path d="M62 58 L48 58 L48 142" />
    <path d="M45 137 L51 142 L45 147" />
    <path d="M54 134 L130 134 L130 150 L54 150 Z" />

    <!-- one leaves by the row, the other by the interface, and neither by a gateway -->
    <path d="M130 105 L160 105 L160 74 L176 74 M171 69 L177 74 L171 79" />
    <path d="M130 142 L168 142 L168 94 L176 94 M171 89 L177 94 L171 99" />

    <!-- the service, which was never inside this network to begin with -->
    <path d="M178 60 L224 60 L224 104 L178 104 Z" />
    <path d="M186 80 L216 80 M186 92 L206 92" />
  </g>

  <!-- the name the interface answers to, which is the whole of how it is found -->
  <circle cx="62" cy="142" r="3" fill="#1d1d1b" />

  <!-- the row that would have carried this traffic to a gateway instead -->
  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4">
    <path d="M60 114 L124 114 L124 124 L60 124 Z" />
  </g>

  <!--
    One official Amazon VPC resource icon (Res_Amazon-VPC_NAT-Gateway_48) from
    the AWS Architecture Icons package, embedded exactly as shipped: #8C4FFF
    line art, uniformly scaled, neither recoloured nor otherwise altered, so
    the sketch theme shows the real product mark rather than an imitation.
