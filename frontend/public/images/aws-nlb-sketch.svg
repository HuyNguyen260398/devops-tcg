<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the balancer is the subject, so it takes the highlighter -->
  <path d="M46 66 L232 66 L232 136 L46 136 Z" fill="#fff2c4" />

  <!-- what travels is one sealed block: nothing here ever opens it -->
  <g fill="#dbe7ff">
    <path d="M66 20 L116 20 L116 38 L66 38 Z" />
    <path d="M162 20 L212 20 L212 38 L162 38 Z" />
    <path d="M66 180 L116 180 L116 198 L66 198 Z" />
    <path d="M162 180 L212 180 L212 198 L162 198 Z" />
    <path d="M116 72 L162 72 L162 78 L116 78 Z" />
    <path d="M84 96 L98 96 L98 110 L84 110 Z" />
    <path d="M180 96 L194 96 L194 110 L180 110 Z" />
    <path d="M57 94 L71 94 L71 100 L57 100 Z" />
    <path d="M207 94 L221 94 L221 100 L207 100 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- two clients, each holding a payload that stays shut -->
    <path d="M58 12 L124 12 L124 46 L58 46 Z" />
    <path d="M66 20 L116 20 L116 38 L66 38 Z" />
    <path d="M154 12 L220 12 L220 46 L154 46 Z" />
    <path d="M162 20 L212 20 L212 38 L162 38 Z" />

    <!-- the balancer itself -->
    <path d="M46 66 L232 66 L232 136 L46 136 Z" stroke-width="4.2" />

    <!-- a listener here is a port, not a rulebook -->
    <path d="M110 68 L168 68 L168 82 L110 82 Z" />
    <path d="M116 72 L162 72 L162 78 L116 78 Z" />

    <!-- one node per zone, each holding an address that outlives every flow -->
    <path d="M52 88 L76 88 L76 120 L52 120 Z" />
    <path d="M57 94 L71 94 L71 100 L57 100 Z" />
    <path d="M57 108 L71 108" />
    <path d="M202 88 L226 88 L226 120 L202 120 Z" />
    <path d="M207 94 L221 94 L221 100 L207 100 Z" />
    <path d="M207 108 L221 108" />

    <!-- each flow crosses unbroken: forwarded, not terminated -->
    <path d="M91 46 L91 164 M85 158 L91 165 L97 158" />
    <path d="M187 46 L187 164 M181 158 L187 165 L193 158" />

    <!-- the hash pins a flow to one target and keeps it there for life -->
    <path d="M84 96 L98 96 L98 110 L84 110 Z" />
    <path d="M180 96 L194 96 L194 110 L180 110 Z" />

    <!-- the payload arrives exactly as it left -->
    <path d="M58 172 L124 172 L124 206 L58 206 Z" />
    <path d="M66 180 L116 180 L116 198 L66 198 Z" />
    <path d="M154 172 L220 172 L220 206 L154 206 Z" />
    <path d="M162 180 L212 180 L212 198 L162 198 Z" />
  </g>

  <!--
