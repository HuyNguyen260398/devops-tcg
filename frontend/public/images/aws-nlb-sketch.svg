    (Res_Elastic-Load-Balancing_Network-Load-Balancer_48) from the AWS
    Architecture Icons package, embedded exactly as shipped: #8C4FFF line art,
    uniformly scaled, not recoloured and not otherwise altered, so the sketch
    theme shows the real product mark rather than a hand-drawn imitation of one.
