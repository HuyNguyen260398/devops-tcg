<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <!-- another policy in scope for the same request, read alongside this one -->
  <path d="M120 60 L178 58 L180 134 L122 136 Z" fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linejoin="round" opacity="0.5" />

  <path d="M112 68 L172 66 L174 144 L114 146 Z" fill="#fff2c4" />
  <g fill="#dbe7ff">
    <path d="M44 98 L84 96 L85 136 L45 138 Z" />
    <path d="M203 94 L224 83 L245 94 L224 105 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- the request: a principal, an action, and the resource it names -->
    <path d="M44 98 L84 96 L85 136 L45 138 Z" />
    <path d="M53 110 L77 109 M53 118 L69 117 M53 126 L73 125" />

    <!-- it arrives at the policies in scope -->
    <path d="M89 118 L103 117 M96 112 L104 117 L96 123" />

    <!-- the policy document itself -->
    <path d="M112 68 L172 66 L174 144 L114 146 Z" />

    <!-- and leaves with a decision -->
    <path d="M170 112 L184 111 M177 106 L185 111 L177 117" />

    <!-- the allow that matched -->
    <path d="M203 94 L224 83 L245 94 L224 105 Z" />
    <path d="M215 94 L221 100 L234 88" stroke-width="2.6" />
  </g>

  <!-- an explicit deny stands in front of the allow, because one anywhere ends
       the evaluation and nothing else can overrule it -->
  <path d="M187 116 L210 104 L233 116 L210 128 Z" fill="#fbfaf6" stroke="#1d1d1b" stroke-width="3" stroke-linejoin="round" />
  <path d="M199 110 L221 122 M199 122 L221 110" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round" />

  <!--
