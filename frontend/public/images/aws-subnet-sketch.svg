<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the NAT gateway and the address it holds are the subject -->
  <path d="M150 62 L182 62 L182 94 L150 94 Z" fill="#fff2c4" />
  <path d="M152 98 L180 98 L180 108 L152 108 Z" fill="#fff2c4" />

  <g fill="#dbe7ff">
    <path d="M78 64 L106 64 L106 92 L78 92 Z" />
    <path d="M190 64 L218 64 L218 92 L190 92 Z" />
    <path d="M81 100 L103 100 L103 106 L81 106 Z" />
    <path d="M155 100 L177 100 L177 106 L155 106 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- one VPC, and the boundary the whole chain has to end at -->
    <path d="M44 44 L234 44 L234 176 L44 176 Z" />

    <!-- two subnets, drawn the same because nothing about them differs -->
    <path d="M52 56 L132 56 L132 116 L52 116 Z" />
    <path d="M142 56 L226 56 L226 116 L142 116 Z" />

    <!-- what is running in the private subnet, over the address it does hold -->
    <path d="M78 64 L106 64 L106 92 L78 92 Z" />
    <path d="M78 98 L106 98 L106 108 L78 108 Z" />
    <path d="M81 100 L103 100 L103 106 L81 106 Z" />

    <!-- its route leaves its own subnet and lands inside the public one -->
    <path d="M108 78 L146 78 M141 73 L147 78 L141 83" />

    <!-- the public address the gateway holds: the half no route can supply -->
    <path d="M152 98 L180 98 L180 108 L152 108 Z" />
    <path d="M155 100 L177 100 L177 106 L155 106 Z" />

    <!-- a machine beside it, in the same subnet, under the very same route -->
    <path d="M190 64 L218 64 L218 92 L190 92 Z" />

    <!-- one row, one gateway, one way out for everything above it -->
    <path d="M166 108 L166 157 M161 152 L166 158 L171 152" />
    <path d="M148 160 L184 160 L184 192 L148 192 Z" />
    <path d="M166 192 L166 198 M161 193 L166 199 L171 193" />
    <path d="M204 108 L204 128" />
  </g>

  <!-- the NAT gateway is not a hop: it is a resource standing in a public subnet -->
  <g fill="none" stroke="#1d1d1b" stroke-width="4.2" stroke-linejoin="round">
    <path d="M150 62 L182 62 L182 94 L150 94 Z" />
  </g>

  <!-- no public address, so the route it shares is a route to nowhere -->
  <path d="M190 98 L218 98 L218 108 L190 108 Z" fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="4 4" />
  <path d="M197 131 L211 145 M211 131 L197 145" fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" />

  <!--
    Two official Amazon VPC resource icons (Res_Amazon-VPC_NAT-Gateway_48 and
    Res_Amazon-VPC_Internet-Gateway_48) from the AWS Architecture Icons
    package, embedded exactly as shipped: #8C4FFF line art, uniformly scaled,
    neither recoloured nor otherwise altered, so the sketch theme shows the real
    product marks rather than hand-drawn imitations of them.
  -->
