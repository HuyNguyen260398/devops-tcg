<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- the plate on the gateway is the subject: the address the machine never holds -->
  <path d="M60 136 L104 136 L104 152 L60 152 Z" fill="#fff2c4" />

  <!-- the only address the machine itself has -->
  <path d="M56 66 L98 66 L98 80 L56 80 Z" fill="#dbe7ff" />

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- one boundary, and a gateway attached to it rather than standing in it -->
    <path d="M50 28 L212 28 L212 128 L50 128 Z" />

    <!-- the machine whose public address is held for it somewhere else -->
    <path d="M62 38 L92 38 L92 60 L62 60 Z" />
    <path d="M56 66 L98 66 L98 80 L56 80 Z" />
    <path d="M64 73 L72 73 M78 73 L90 73" />
    <path d="M77 80 L77 96 L114 96 L114 110 M109 105 L114 111 L119 105" />

    <!-- the machine that reaches for that public address instead of the private one -->
    <path d="M160 38 L190 38 L190 60 L160 60 Z" />
    <path d="M156 49 L96 49" />
    <path d="M190 49 L222 49 L222 140 L166 140 M171 135 L165 140 L171 145" />

    <!-- and the one carrying an address that needs nothing swapped at all -->
    <path d="M162 74 L192 74 L192 96 L162 96 Z" />
    <path d="M177 96 L177 104 L156 104 L156 110 M151 105 L156 111 L161 105" />

    <path d="M108 110 L162 110 L162 150 L108 150 Z" />
    <path d="M108 144 L104 144" />
    <path d="M66 144 L78 144 M84 144 L98 144" />

    <path d="M126 150 L126 166 M121 161 L126 167 L131 161" />
    <path d="M146 150 L146 166 M141 161 L146 167 L151 161" />
    <path d="M104 172 L168 172 L168 194 L104 194 Z" />
  </g>

  <!-- the address that is held here, and the direct path that is never taken -->
  <g fill="none" stroke="#1d1d1b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 136 L104 136 L104 152 L60 152 Z" />
    <path d="M121 43 L131 55 M131 43 L121 55" />
  </g>

