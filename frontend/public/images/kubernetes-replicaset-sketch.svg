<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 220">
  <g transform="translate(139 110) scale(0.88) translate(-139 -110)">
  <!-- what each object has written on it -->
  <g fill="#dbe7ff">
    <path d="M116 28 L166 28 L166 33 L116 33 Z" />
    <path d="M83 106 L97 106 L97 111 L83 111 Z" />
    <path d="M114 106 L128 106 L128 111 L114 111 Z" />
    <path d="M145 106 L159 106 L159 111 L145 111 Z" />
    <path d="M43 106 L57 106 L57 111 L43 111 Z" />
    <path d="M214 106 L228 106 L228 111 L214 111 Z" />
    <path d="M205 180 L219 180 L219 185 L205 185 Z" />
  </g>

  <!-- the one mark the selector names, worn by everything it counts as its own -->
  <g fill="#fff2c4">
    <path d="M98 27 L110 27 L110 39 L98 39 Z" />
    <path d="M83 86 L95 86 L95 98 L83 98 Z" />
    <path d="M114 86 L126 86 L126 98 L114 98 Z" />
    <path d="M145 86 L157 86 L157 98 L145 98 Z" />
    <path d="M43 86 L55 86 L55 98 L43 98 Z" />
    <path d="M214 86 L226 86 L226 98 L214 98 Z" />
    <path d="M205 164 L217 164 L217 176 L205 176 Z" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- the two bars that make the mark the same mark everywhere it appears -->
    <path d="M100 31 L108 31 M100 35 L108 35" />
    <path d="M85 90 L93 90 M85 94 L93 94" />
    <path d="M116 90 L124 90 M116 94 L124 94" />
    <path d="M147 90 L155 90 M147 94 L155 94" />
    <path d="M45 90 L53 90 M45 94 L53 94" />
    <path d="M216 90 L224 90 M216 94 L224 94" />
    <path d="M207 168 L215 168 M207 172 L215 172" />

    <!-- what the selector says for itself -->
    <path d="M116 38 L158 38 M98 45 L172 45" />

    <!-- and what stands written on each pod it is counting -->
    <path d="M83 119 L101 119 M83 127 L97 127" />
    <path d="M114 119 L132 119 M114 127 L128 127" />
    <path d="M145 119 L163 119 M145 127 L159 127" />
    <path d="M43 119 L61 119 M43 127 L57 127" />
    <path d="M214 119 L232 119 M214 127 L228 127" />
    <path d="M205 190 L223 190" />

    <!-- the template, which is read once and never again -->
    <path d="M102 170 L132 170 M102 178 L124 178 M102 186 L128 186" />
  </g>

  <!-- the tie this pod no longer has, and the edit that reaches nothing running -->
  <g fill="none" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round">
    <path d="M186 36 L224 36 L224 80" />
    <path d="M117 160 L117 146" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round">
    <!-- the mark this pod has just been relabelled out of -->
    <path d="M215 85 L225 99 M225 85 L215 99" />
    <!-- the tie that went with it -->
    <path d="M220 54 L228 62 M228 54 L220 62" />
    <!-- an edited template changes nothing that is already running -->
    <path d="M113 149 L121 157 M121 149 L113 157" />
    <!-- the pod on its way out, which has already stopped being counted -->
    <path d="M178 168 L194 186 M194 168 L178 186" />
  </g>

  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- the selector, and the tie down to each pod that matches it -->
    <path d="M92 22 L186 22 L186 52 L92 52 Z" />
    <path d="M139 52 L139 62" />
    <path d="M93 62 L155 62" />
    <path d="M93 62 L93 80 M124 62 L124 80 M155 62 L155 80" />

    <!-- the three pods currently answering to it -->
    <path d="M80 80 L106 80 L106 142 L80 142 Z" />
    <path d="M111 80 L137 80 L137 142 L111 142 Z" />
    <path d="M142 80 L168 80 L168 142 L142 142 Z" />

    <!-- one arriving that it never made, and one it has just let go of -->
    <path d="M40 80 L66 80 L66 142 L40 142 Z" />
    <path d="M211 80 L237 80 L237 142 L211 142 Z" />

    <!-- the template, and the pod that has taken the leaving one's place -->
    <path d="M96 160 L138 160 L138 194 L96 194 Z" />
    <path d="M202 160 L226 160 L226 194 L202 194 Z" />
  </g>

  <!-- the slot the count is one short of, and the pod still going that no longer counts -->
  <g fill="none" stroke="#1d1d1b" stroke-width="2.4" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M173 80 L199 80 L199 142 L173 142 Z" />
    <path d="M174 160 L198 160 L198 194 L174 194 Z" />
  </g>

  <!-- taken in on an arrow, and both of the last two standing at once -->
  <g fill="none" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 111 L78 111" />
    <path d="M174 154 L226 154" />
  </g>
  <g fill="none" stroke="#1d1d1b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 107 L78 111 L74 115" />
  </g>
  </g>
</svg>
